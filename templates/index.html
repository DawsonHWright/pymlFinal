<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alphabetic vs Numeric Classifier</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Draw a Letter or Number</h1>
        <p>The model will guess whether your drawing is alphabetic or numeric.</p>

        <canvas id="canvas" width="300" height="300"></canvas>

        <div class="buttons">
            <button id="predictBtn">Predict</button>
            <button id="clearBtn">Clear</button>
        </div>

        <div class="results">
            <h2>Result</h2>
            <p><strong>Prediction:</strong> <span id="prediction">-</span></p>
            <p><strong>Confidence:</strong> <span id="confidence">-</span></p>
            <p><strong>Alphabetic probability:</strong> <span id="alphaProb">-</span></p>
            <p><strong>Numeric probability:</strong> <span id="numProb">-</span></p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");

        const predictBtn = document.getElementById("predictBtn");
        const clearBtn = document.getElementById("clearBtn");

        const predictionEl = document.getElementById("prediction");
        const confidenceEl = document.getElementById("confidence");
        const alphaProbEl = document.getElementById("alphaProb");
        const numProbEl = document.getElementById("numProb");

        let drawing = false;

        function setupCanvas() {
            ctx.fillStyle = "white";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = "black";
            ctx.lineWidth = 16;
            ctx.lineCap = "round";
            ctx.lineJoin = "round";
        }

        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: e.clientX - rect.left,
                y: e.clientY - rect.top
            };
        }

        canvas.addEventListener("mousedown", (e) => {
            drawing = true;
            const pos = getMousePos(e);
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
        });

        canvas.addEventListener("mousemove", (e) => {
            if (!drawing) return;
            const pos = getMousePos(e);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
        });

        canvas.addEventListener("mouseup", () => {
            drawing = false;
        });

        canvas.addEventListener("mouseleave", () => {
            drawing = false;
        });

        clearBtn.addEventListener("click", () => {
            setupCanvas();
            predictionEl.textContent = "-";
            confidenceEl.textContent = "-";
            alphaProbEl.textContent = "-";
            numProbEl.textContent = "-";
        });

        predictBtn.addEventListener("click", async () => {
            const imageData = canvas.toDataURL("image/png");

            const response = await fetch("/predict", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ image: imageData })
            });

            const result = await response.json();

            if (result.error) {
                predictionEl.textContent = "Error";
                confidenceEl.textContent = result.error;
                alphaProbEl.textContent = "-";
                numProbEl.textContent = "-";
                return;
            }

            predictionEl.textContent = result.prediction;
            confidenceEl.textContent = result.confidence + "%";
            alphaProbEl.textContent = result.alphabetic_probability + "%";
            numProbEl.textContent = result.numeric_probability + "%";
        });

        setupCanvas();
    </script>
</body>
</html>
